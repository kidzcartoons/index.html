        .spinner {

        <div class="timer" id="timer">5</div>

        <div class="telegram" id="telegram">
            ♥️ Join Our Telegram - @AtozCartoonsPremium
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        let countdown = 5;

        const timerElement = document.getElementById("timer");
        const telegramElement = document.getElementById("telegram");

        const timer = setInterval(() => {
            countdown--;

            timerElement.textContent = countdown;

            if (countdown <= 0) {
                clearInterval(timer);

                timerElement.style.display = "none";
                telegramElement.style.display = "block";

                setTimeout(() => {
                    if (token) {
                        window.location.href =
                            `/api/redirect?token=${encodeURIComponent(token)}`;
                    }
                }, 1000);
            }
        }, 1000);
    </script>
