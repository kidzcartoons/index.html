<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading post...</title>
  <link rel="icon" href="https://i.postimg.cc/02NYDg6G/cartoon-favicon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #090909;
      --surface: #131313;
      --surface-soft: #1b1b1b;
      --border: #242424;
      --text: #f4f4f4;
      --muted: #9a9a9a;
      --accent: #ff4d5a;
      --shadow: 0 24px 62px rgba(0,0,0,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #151515 0%, #090909 48%, #050505 100%);
      color: var(--text);
      line-height: 1.7;
    }

    a { color: inherit; text-decoration: none; }

    .page-shell {
      max-width: 1080px;
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: rgba(22,22,22,0.94);
      padding: 18px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.07rem; }
    .brand i { color: var(--accent); }

    .button { display: inline-flex; align-items: center; gap: 8px; padding: 12px 16px; border-radius: 999px; background: rgba(255,77,90,0.15); color: var(--text); border: 1px solid rgba(255,77,90,0.18); transition: transform .2s ease; }
    .button:hover { transform: translateY(-1px); }

    .header-card {
      display: grid;
      gap: 18px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
      background: linear-gradient(180deg, rgba(255,77,90,0.08), rgba(15,15,15,0.96));
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .post-banner { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }

    .post-meta {
      display: grid;
      gap: 14px;
      padding: 22px;
    }

    .post-category { display: inline-flex; gap: 10px; align-items: center; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .post-title { font-size: clamp(2rem, 3vw, 3.2rem); line-height: 1.05; }
    .post-summary { color: var(--muted); max-width: 760px; }
    .post-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }

    .post-grid {
      display: grid;
      gap: 22px;
      grid-template-columns: 1.4fr 0.8fr;
    }

    .content-card, .sidebar-card, .related-card { background: var(--surface); border-radius: 22px; border: 1px solid rgba(255,255,255,0.06); padding: 22px; box-shadow: var(--shadow); }

    .detail-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .detail-table tr { border-bottom: 1px solid rgba(255,255,255,0.06); }
    .detail-table td { padding: 12px 0; font-size: 0.95rem; }
    .detail-table td:first-child { color: var(--accent); width: 38%; font-weight: 700; }

    .tag-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .tag-pill { padding: 10px 14px; border-radius: 999px; background: rgba(255,77,90,0.12); color: #ffd7dc; font-weight: 700; font-size: 0.88rem; }

    .content-card p { margin-bottom: 18px; color: #dcdcdc; }

    .downloads-list { display: grid; gap: 12px; margin-top: 12px; }
    .download-link { display: inline-flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: var(--text); }
    .download-link i { color: var(--accent); }

    .related-card h2 { margin-bottom: 16px; }
    .related-list { display: grid; gap: 14px; }

    .related-item {
      display: grid;
      gap: 10px;
      padding: 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .related-item a { font-weight: 700; }
    .related-item .meta { color: var(--muted); font-size: 0.88rem; }

    .not-found { padding: 60px 20px; text-align: center; color: var(--muted); }
    .not-found h1 { margin-bottom: 18px; }

    @media (max-width: 900px) {
      .post-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="index.html"><i class="fas fa-film"></i> Kidz Cartoons Hub</a>
      <div>
        <a class="button" href="index.html"><i class="fas fa-arrow-left"></i> Back to Library</a>
      </div>
    </header>

    <main id="postContent"></main>
  </div>

  <script>
    const postsPath = 'posts.json';
    const postContent = document.getElementById('postContent');
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    function slugify(text) {
      return text.toString().toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
    }

    function createDetailRows(details) {
      return Object.entries(details).map(([key, value]) => `
        <tr><td>${key}</td><td>${value}</td></tr>
      `).join('');
    }

    function createTags(tags) {
      return tags.map(tag => `<span class="tag-pill">${tag}</span>`).join('');
    }

    function renderRelated(posts, currentSlug) {
      if (!posts.length) return '';
      return `
        <section class="related-card">
          <h2>More stories you may like</h2>
          <div class="related-list">
            ${posts.map(post => `
              <div class="related-item">
                <a href="post.html?slug=${encodeURIComponent(post.slug)}">${post.title}</a>
                <div class="meta">${post.category} · ${post.date}</div>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    async function loadPost() {
      try {
        const response = await fetch(postsPath);
        const posts = await response.json();
        const chosen = posts.find(post => post.slug === slug);
        if (!chosen) {
          postContent.innerHTML = `
            <div class="not-found">
              <h1>Story not found</h1>
              <p>We couldn't locate a post for <strong>${slug || 'this page'}</strong>. Please return to the homepage and choose another story.</p>
            </div>
          `;
          document.title = 'Post not found — Kidz Cartoons Hub';
          return;
        }

        document.title = `${chosen.title} | Kidz Cartoons Hub`;
        const related = posts.filter(post => post.slug !== chosen.slug && post.category === chosen.category).slice(0, 3);

        postContent.innerHTML = `
          <article class="header-card">
            <img class="post-banner" src="${chosen.banner || chosen.image}" alt="${chosen.title}" loading="lazy" />
            <div class="post-meta">
              <div class="post-category"><i class="fas fa-tags"></i>${chosen.category}</div>
              <h1 class="post-title">${chosen.title}</h1>
              <p class="post-summary">${chosen.summary}</p>
              <div class="post-actions">
                <a class="button" href="index.html"><i class="fas fa-home"></i> Back to library</a>
                <a class="button" href="editor.html"><i class="fas fa-pencil-alt"></i> Add new post</a>
              </div>
            </div>
          </article>

          <div class="post-grid">
            <section class="content-card">
              <div class="tag-grid">${createTags(chosen.tags)}</div>
              <div class="content-body">${chosen.content.split('\n\n').map(paragraph => `<p>${paragraph}</p>`).join('')}</div>
            </section>
            <aside class="sidebar-card">
              <h2>Details</h2>
              <table class="detail-table">${createDetailRows(chosen.details)}</table>
              <div class="downloads-list">
                ${chosen.downloadLinks.map(link => `
                  <a class="download-link" href="${link.url}" target="_blank" rel="noopener noreferrer">
                    <span>${link.label}</span>
                    <i class="fas fa-external-link-alt"></i>
                  </a>
                `).join('')}
              </div>
            </aside>
          </div>

          ${renderRelated(related, chosen.slug)}
        `;
      } catch (error) {
        postContent.innerHTML = '<div class="not-found"><h1>Unable to load story</h1><p>Please try again later.</p></div>';
        console.error(error);
      }
    }

    loadPost();
  </script>
</body>
</html>
