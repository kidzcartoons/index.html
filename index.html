<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atoz Cartoons Premium</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#0a0a0a;
      color:#fff;
      font-family:Segoe UI,Tahoma,Verdana,sans-serif;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .header{
      position:sticky;
      top:0;
      z-index:999;
      background:#111;
      border-bottom:1px solid #222;
      padding:15px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .logo{
      color:#ff4757;
      font-size:22px;
      font-weight:800;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .search-wrap{
      padding:14px 15px;
      background:#111;
      border-bottom:1px solid #222;
    }

    .search-toggle{
      width:46px;
      height:46px;
      border-radius:50%;
      background:#171717;
      border:1px solid #2b2b2b;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      cursor:pointer;
      margin:auto;
    }

    .search-box{
      max-width:700px;
      margin:14px auto 0;
      position:relative;
      border:1px solid #2d2d2d;
      border-radius:999px;
      overflow:hidden;
    }

    .hidden-search{
      display:none;
    }

    .search-box input{
      width:100%;
      background:#0d0d0d;
      color:#fff;
      border:0;
      outline:none;
      padding:14px 48px 14px 18px;
      font-size:15px;
    }

    .search-box i{
      position:absolute;
      right:18px;
      top:50%;
      transform:translateY(-50%);
      color:#ff4757;
      cursor:pointer;
    }

    .hero{
      max-width:1200px;
      margin:18px auto;
      padding:0 15px;
    }

    .hero-card{
      border-radius:18px;
      overflow:hidden;
      position:relative;
      border:1px solid #2a2a2a;
    }

    .hero-slider{
      overflow:hidden;
    }

    .hero-track{
      display:flex;
      transition:transform .4s ease;
    }

    .hero-slide{
      min-width:100%;
      position:relative;
      cursor:pointer;
    }

    .hero-slide img{
      width:100%;
      height:240px;
      object-fit:cover;
      display:block;
    }

    .overlay{
      position:absolute;
      inset:0;
      background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.2));
    }

    .hero-content{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      padding:18px;
    }

    .hero-content h1{
      font-size:24px;
      margin-bottom:8px;
    }

    .hero-content p{
      color:#ddd;
      line-height:1.7;
    }

    .hero-dots{
      display:flex;
      justify-content:center;
      gap:8px;
      padding:12px;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:#444;
      cursor:pointer;
    }

    .dot.active{
      background:#ff4757;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:15px;
    }

    .section-title{
      font-size:22px;
      font-weight:800;
      margin-bottom:16px;
      border-left:4px solid #ff4757;
      padding-left:12px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:16px;
    }

    .card{
      background:#151515;
      border:1px solid #272727;
      border-radius:14px;
      overflow:hidden;
      transition:.25s;
      cursor:pointer;
    }

    .card:hover{
      transform:translateY(-5px);
      border-color:#ff4757;
    }

    .card img{
      width:100%;
      height:260px;
      object-fit:cover;
    }

    .card-info{
      padding:12px;
    }

    .tag-row{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }

    .tag{
      background:#ff4757;
      color:#fff;
      font-size:10px;
      padding:5px 8px;
      border-radius:6px;
      font-weight:700;
    }

    .card h3{
      font-size:15px;
      line-height:1.5;
      margin-bottom:10px;
    }

    .view-btn{
      background:linear-gradient(45deg,#ff4757,#ff6b57);
      text-align:center;
      padding:11px;
      border-radius:8px;
      font-weight:700;
    }

    .footer{
      margin-top:30px;
      text-align:center;
      padding:25px 15px;
      border-top:2px solid #ff4757;
      background:#111;
    }

    .footer p{
      color:#aaa;
      line-height:1.8;
    }

    .copyright{
      color:#ff4757;
      font-weight:800;
      margin-top:8px;
    }

    .hidden{
      display:none !important;
    }

    @media(min-width:700px){
      .grid{
        grid-template-columns:repeat(4,1fr);
      }

      .hero-slide img{
        height:320px;
      }
    }
  </style>
</head>
<body>

<div class="header">
  <a href="/" class="logo">
    <i class="fas fa-play-circle"></i>
    Atoz Cartoons Premium
  </a>
</div>

<div class="search-wrap">

  <div class="search-toggle" onclick="toggleSearch()">
    <i class="fas fa-search"></i>
  </div>

  <div class="search-box hidden-search" id="searchBox">
    <input id="searchInput" type="text" placeholder="Search posts...">
    <i class="fas fa-search" onclick="performSearch()"></i>
  </div>

</div>

<div class="hero" id="heroSection">
  <div class="hero-card">

    <div class="hero-slider">
      <div class="hero-track" id="heroTrack"></div>
    </div>

    <div class="hero-dots" id="heroDots"></div>

  </div>
</div>

<div class="container">

  <div class="section-title">LATEST POSTS</div>

  <div class="grid" id="postGrid"></div>

</div>

<div class="footer">
  <p>Atoz Cartoons Premium - Premium Anime Collection</p>
  <p class="copyright">© <span id="year"></span> Atoz Cartoons Premium</p>
</div>

<script>

document.getElementById('year').textContent = new Date().getFullYear();

const postGrid = document.getElementById('postGrid');
const heroTrack = document.getElementById('heroTrack');
const heroDots = document.getElementById('heroDots');
const searchInput = document.getElementById('searchInput');

let allPosts = [];
let heroPosts = [];
let heroIndex = 0;
let heroTimer;

function toggleSearch(){
  document.getElementById('searchBox').classList.toggle('hidden-search');
  searchInput.focus();
}

function createCard(post){

  const card = document.createElement('div');

  card.className = 'card';

  card.innerHTML = `
    <img src="${post.image}" alt="${post.title}">

    <div class="card-info">

      <div class="tag-row">
        <span class="tag">${post.category || 'ANIME'}</span>
        ${(post.tags || []).slice(0,2).map(tag => `<span class="tag">${tag}</span>`).join('')}
      </div>

      <h3>${post.title}</h3>

      <div class="view-btn">VIEW DETAILS</div>

    </div>
  `;

  card.onclick = () => {
    window.location.href = post.url;
  };

  return card;
}

function renderPosts(posts){

  postGrid.innerHTML = '';

  posts.forEach(post => {
    postGrid.appendChild(createCard(post));
  });
}

function setupHero(posts){

  heroPosts = posts.slice(0,6);

  heroTrack.innerHTML = '';
  heroDots.innerHTML = '';

  heroPosts.forEach((post,index)=>{

    const slide = document.createElement('div');

    slide.className = 'hero-slide';

    slide.innerHTML = `
      <img src="${post.image}" alt="${post.title}">

      <div class="overlay"></div>

      <div class="hero-content">
        <h1>${post.title}</h1>
        <p>${(post.story || '').slice(0,120)}...</p>
      </div>
    `;

    slide.onclick = () => {
      window.location.href = post.url;
    };

    heroTrack.appendChild(slide);

    const dot = document.createElement('div');

    dot.className = 'dot' + (index === 0 ? ' active' : '');

    dot.onclick = () => goHero(index);

    heroDots.appendChild(dot);
  });

  goHero(0);

  clearInterval(heroTimer);

  heroTimer = setInterval(()=>{
    goHero((heroIndex + 1) % heroPosts.length);
  },4000);
}

function goHero(index){

  heroIndex = index;

  heroTrack.style.transform = `translateX(-${index * 100}%)`;

  [...heroDots.children].forEach((dot,i)=>{
    dot.classList.toggle('active', i === index);
  });
}

function performSearch(){

  const q = searchInput.value.toLowerCase().trim();

  if(!q) return;

  const found = allPosts.find(post =>
    post.title.toLowerCase().includes(q)
  );

  if(found){
    window.location.href = found.url;
  }
}

searchInput.addEventListener('keypress', function(e){
  if(e.key === 'Enter'){
    performSearch();
  }
});

fetch('post.json')
.then(res => res.json())
.then(data => {

  allPosts = data;

  renderPosts(allPosts);

  setupHero(allPosts);

})
.catch(err => {
  console.log(err);
});

</script>

</body>
</html>
